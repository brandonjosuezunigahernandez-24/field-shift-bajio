<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probar el asistente</title>
<style>
  :root { --verde: #14532d; --verde2: #1f7a45; --fondo: #f4f7f2; --borde: #b9cbb9; }
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 20px auto; padding: 0 16px; background: var(--fondo); color: #1c2a1c; font-size: 18px; }
  h1 { margin: 0 0 4px; }
  small { color: #4a5a4a; }
  .tema { margin: 14px 0 4px; font-weight: 700; font-size: 17px; }
  button { font-size: 19px; padding: 14px 18px; min-height: 54px; border-radius: 12px; border: 2px solid var(--verde2); background: #fff; color: var(--verde); cursor: pointer; margin: 4px 6px 4px 0; text-align: left; }
  button:hover, button:focus-visible { background: #e3f1e6; outline: 3px solid #9fd1ac; }
  button.principal { background: var(--verde); color: #fff; border-color: var(--verde); font-weight: 700; }
  input { font-size: 20px; padding: 14px; width: 100%; box-sizing: border-box; border: 2px solid var(--borde); border-radius: 12px; }
  #out { white-space: pre-wrap; background: #fff; border: 2px solid var(--borde); padding: 16px; border-radius: 14px; margin-top: 14px; min-height: 90px; font-size: 19px; line-height: 1.5; }
  #meta { color: #4a5a4a; font-size: 15px; margin-top: 6px; }
  #opciones button { border-color: var(--verde); font-weight: 600; }
  #nota { font-size: 15px; color: #4a5a4a; margin-top: 10px; }
  #perfil { font-size: 15px; color: #4a5a4a; margin-top: 8px; }
</style>
</head>
<body>
<h1>Probar el asistente</h1>
<small>Herramienta de prueba (no es la app final). Parcela de ejemplo: Celaya, Gto. Cada pregunta nueva borra la respuesta anterior.</small>

<div id="temas"></div>

<p style="margin-top:16px"><input id="q" placeholder="Escribe tu pregunta (o toca una de arriba)"></p>
<button id="go" class="principal">Preguntar</button>
<button id="reiniciar">Empezar de nuevo</button>

<div id="out">Toca una pregunta o escribe la tuya. La primera tarda unos 30 segundos (carga el modelo).</div>
<div id="meta"></div>
<div id="opciones"></div>
<div id="perfil"></div>
<p id="nota"></p>

<script>
const out = document.getElementById('out');
const meta = document.getElementById('meta');
const opciones = document.getElementById('opciones');
const perfilEl = document.getElementById('perfil');
const q = document.getElementById('q');
let perfil = {};
let ultimaPregunta = '';

fetch('/api/asistente/temas').then((r) => r.json()).then(({ temas, nota }) => {
  document.getElementById('nota').textContent = nota;
  document.getElementById('temas').innerHTML = temas.map((t) =>
    `<div class="tema">${t.titulo}</div>` + t.preguntas.map((p) => `<button data-q="${p}">${p}</button>`).join('')
  ).join('');
  document.querySelectorAll('[data-q]').forEach((b) => b.onclick = () => ask(b.dataset.q));
});

function mostrarPerfil() {
  const k = Object.keys(perfil);
  perfilEl.textContent = k.length ? 'Lo que me has dicho: ' + k.map((c) => `${c}: ${perfil[c]}`).join(' · ') : '';
}

function botonesDeOpciones(preguntar, etiqueta) {
  opciones.innerHTML = `<p><strong>${etiqueta}</strong></p>` + preguntar.opciones.map((o) => `<button data-v="${o.valor}">${o.texto}</button>`).join('');
  opciones.querySelectorAll('button').forEach((b) => b.onclick = () => {
    perfil[preguntar.campo] = b.dataset.v;
    mostrarPerfil();
    ask(ultimaPregunta, true);
  });
}

async function ask(pregunta, repetir = false) {
  q.value = repetir ? '' : pregunta;
  ultimaPregunta = pregunta;
  out.textContent = 'Pensando…';       // borra la respuesta anterior
  meta.textContent = '';
  opciones.innerHTML = '';
  const t = Date.now();
  try {
    const res = await fetch('/api/asistente', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ lat: 20.47, lon: -100.81, pregunta, perfil }),
    });
    const j = await res.json();
    if (j.error) { out.textContent = 'Error: ' + j.error; return; }
    out.textContent = j.respuesta;
    meta.textContent = `origen: ${j.origen} · fuentes: ${j.fuentes.join(', ') || 'ninguna'} · ${((Date.now() - t) / 1000).toFixed(1)} s`;
    if (j.preguntar) botonesDeOpciones(j.preguntar, 'Para ayudarte necesito saber:');
    else if (j.afinar?.length) botonesDeOpciones(j.afinar[0], 'Para afinar tu resultado: ' + j.afinar[0].pregunta);
  } catch (e) { out.textContent = 'No se pudo conectar: ' + e.message; }
}

document.getElementById('go').onclick = () => q.value.trim() && ask(q.value.trim());
q.onkeydown = (e) => { if (e.key === 'Enter' && q.value.trim()) ask(q.value.trim()); };
document.getElementById('reiniciar').onclick = () => { perfil = {}; mostrarPerfil(); q.value = ''; opciones.innerHTML = ''; meta.textContent = ''; out.textContent = 'Listo, empezamos de nuevo.'; };
</script>
</body>
</html>
